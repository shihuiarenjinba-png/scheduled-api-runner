name: Improvement branch regression
on:
  push:
    branches:
      - 'improve/daily-csv-safeguards-20261018'
  workflow_dispatch:
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
